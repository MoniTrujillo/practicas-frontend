<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3 </title>
</head>
<body>
    <main>
        <h1>Formulario de registro</h1>

        <form action="https://monica-formulario.com/enviar" method="post" target="_blank">

            <div>
                <label for="name">Nombre</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    autocomplete="given-name"
                    required
                    aria-required="true"
                />
            </div>

            <div>
                <label for="last">Apellido</label>
                <input
                    type="text"
                    id="last"
                    name="last"
                    autocomplete="family-name"
                    required
                    aria-required="true"
                />
            </div>

            <div>
                <label for="age">Edad</label>
                <input
                    type="number"
                    id="age"
                    name="age"
                    min="0"
                    max="120"
                    required
                    aria-required="true"
                />
            </div>

            <div>
                <label for="email">Correo electrónico</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    autocomplete="email"
                    required
                    aria-required="true"
                />
            </div>

            <fieldset>
                <legend>¿Aceptas los términos? (radio)</legend>
                <div>
                    <input type="radio" id="terms-yes" name="terms-radio" value="yes" required />
                    <label for="terms-yes">Sí</label>
                </div>
                <div>
                    <input type="radio" id="terms-no" name="terms-radio" value="no" />
                    <label for="terms-no">No</label>
                </div>
            </fieldset>

            <div>
                <input type="checkbox" id="terms-checkbox" name="terms-checkbox" required />
                <label for="terms-checkbox">Acepto los términos y condiciones (checkbox)</label>
            </div>

            <button type="submit">Enviar</button>

        </form>
    </main>
</body>
</html>
